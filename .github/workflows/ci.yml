name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile --ignore-engines
    
    - name: Run tests
      run: yarn unit-test
    
    - name: Build project
      run: yarn build
